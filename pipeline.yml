# ==============================================================================
# .github/workflows/pipeline.yml
# IDBI Gift Voucher Recommendation Engine — GitHub Actions CI/CD Pipeline
#
# EXACT MIRROR of TFS pipeline.yml structure:
#   TFS trigger: ci-cd-final         →  on.push.branches: [ci-cd-final]
#   TFS pool: cicd-test (Jenkins)    →  runs-on: ubuntu-latest
#   TFS condition: succeeded()       →  if: success()
#   TFS docker-compose               →  docker compose (v2)
#   TFS make destroy                 →  docker compose down --volumes
#
# PROJECT STRUCTURE:
#   src/                   — 9 source modules
#   tests/test_smoke.py    — 28 smoke tests (3 classes)
#     TestEnvironmentSetup     — 8 tests  (Category 1)
#     TestModuleImports        — 13 tests (Category 2)
#     TestModelReadiness       — 7 tests  (Category 3)
#   tests/post_training/test_artifacts.py — 22 artifact tests (TestPklArtifacts)
#   data/generate_dataset.py  — synthetic dataset generator
#   train_pipeline.py         — 8-phase training orchestrator
#   docker-compose.yml        — service: app, container: recommendation-engine-idbi
#
# 8 STEPS (mirrors TFS exactly):
#   Step 1  — CI: Ruff Linting (on runner, no container)
#   Step 2  — Compose Check
#   Step 3  — Start Container via Docker Compose
#   Step 4  — Verify Container is Running
#   Step 5  — CI: Smoke Tests inside Container (28 tests)
#   Step 6  — CD: Run train_pipeline.py inside Container
#   Step 7  — Post CD: Model Artifact Checks inside Container (22 tests)
#   Step 8  — Destroy Container
# ==============================================================================

name: "IDBI Recommendation Engine — CI/CD Pipeline"

# ------------------------------------------------------------------------------
# TRIGGER
# TFS equivalent →  trigger: ci-cd-final
# Fires automatically on every push to ci-cd-final branch
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - ci-cd-final
  pull_request:
    branches:
      - ci-cd-final

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT VARIABLES
# TFS equivalent → variables block
# UV_FROZEN=1 mirrors docker-compose.yml environment section
# ------------------------------------------------------------------------------
env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
  COMPOSE_PROJECT_NAME: recommendation-engine-idbi

jobs:
  pipeline:
    # --------------------------------------------------------------------------
    # AGENT POOL
    # TFS equivalent → pool: name: cicd-test
    # ubuntu-latest has Docker + docker compose pre-installed (no extra setup)
    # --------------------------------------------------------------------------
    name: "IDBI CI/CD Pipeline — 8 Steps"
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------------
      # CHECKOUT
      # TFS equivalent → git pull triggered automatically by branch push
      # Pulls ci-cd-final branch onto the runner machine
      # ------------------------------------------------------------------------
      - name: "Checkout ci-cd-final branch"
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # INSTALL UV ON RUNNER
      # TFS equivalent → UV pre-installed on cicd-test agent machine
      # GitHub runner does not have UV by default so install it here
      # ------------------------------------------------------------------------
      - name: "Install UV (Rust-based package manager)"
        uses: astral-sh/setup-uv@v3

      - name: "Set up Python 3.9 and sync dependencies via UV"
        run: |
          uv python install 3.9
          uv venv .venv
          uv sync

      # ========================================================================
      # STEP 1 — CI: LINTING WITH RUFF
      # TFS equivalent → Step 1: CI Ruff Linting with uv on Agent Machine
      # Runs DIRECTLY on runner machine — no container needed
      # --select F      → Pyflakes: F401 unused imports, F821 undefined names
      # --ignore E402   → allow imports not at top of file
      # Pipeline STOPS immediately if any linting errors found
      # ========================================================================
      - name: "Step 1 — CI: Ruff Linting with uv on Runner Machine"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 1 — CI: Ruff Linting"
          echo "========================================================"
          uv run ruff --version
          uv run ruff check . --select F --ignore E402 --output-format grouped
          echo "✓ Zero lint errors — pipeline continues to Step 2"

      # ========================================================================
      # STEP 2 — COMPOSE CHECK
      # TFS equivalent → Step 2: Compose Check
      # Shows current state of containers before anything starts
      # Only reached if Step 1 linting passed
      # ========================================================================
      - name: "Step 2 — Compose Check"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 2 — Compose Check"
          echo "========================================================"
          docker compose ps
          echo "✓ Compose check complete — proceeding to build"

      # ========================================================================
      # STEP 3 — START CONTAINER VIA DOCKER COMPOSE
      # TFS equivalent → Step 3: Start Container via Docker Compose
      # Builds image from Dockerfile (python:3.9-slim + libgomp1 + UV)
      # docker compose up -d → runs container in detached mode (background)
      # Service name: app  |  Container name: recommendation-engine-idbi
      # Named volumes: recommendation-engine-venv, recommendation-engine-uv-cache
      # Only reached if linting passed
      # ========================================================================
      - name: "Step 3 — Start Container via Docker Compose"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 3 — Start Container via Docker Compose"
          echo "========================================================"
          docker compose build
          docker compose up -d
          echo "✓ Container recommendation-engine-idbi started in detached mode"

      # ========================================================================
      # STEP 4 — VERIFY CONTAINER IS RUNNING
      # TFS equivalent → Step 4: Verify Container is Running
      # Confirms recommendation-engine-idbi container started successfully
      # before running any tests inside it
      # ========================================================================
      - name: "Step 4 — Verify Container is Running"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 4 — Verify Container is Running"
          echo "========================================================"
          docker compose ps -a
          echo "✓ Container status verified — proceeding to smoke tests"

      # ========================================================================
      # STEP 5 — CI: SMOKE TESTS INSIDE CONTAINER (28 TESTS)
      # TFS equivalent → Step 5: CI Tests Categories 1,2,3,4 Inside Container
      #
      # Runs INSIDE the recommendation-engine-idbi container
      # Generates dataset first (required for some env tests)
      # Then runs all 3 test classes from tests/test_smoke.py:
      #
      #   TestEnvironmentSetup  (8 tests)  — Category 1
      #     test_python_version_is_39_or_higher
      #     test_project_root_exists
      #     test_uv_virtual_environment_active
      #     test_model_artifacts_directory_exists
      #     test_logs_directory_writable
      #     test_data_directory_exists
      #     test_requirements_txt_present
      #     test_config_constants_are_valid
      #
      #   TestModuleImports  (13 tests)  — Category 2
      #     test_module_imports_without_error[src.config]
      #     test_module_imports_without_error[src.data_loader]
      #     test_module_imports_without_error[src.preprocessor]
      #     test_module_imports_without_error[src.als_model]
      #     test_module_imports_without_error[src.embedding_model]
      #     test_module_imports_without_error[src.hybrid_scorer]
      #     test_module_imports_without_error[src.recommender]
      #     test_module_imports_without_error[src.evaluator]
      #     test_module_imports_without_error[src.database]
      #     test_implicit_library_importable
      #     test_sentence_transformers_importable
      #     test_scipy_sparse_importable
      #     test_sklearn_label_encoder_importable
      #     test_sqlalchemy_importable
      #
      #   TestModelReadiness  (7 tests)  — Category 3
      #     test_als_model_instantiation
      #     test_als_model_trains_on_synthetic_data
      #     test_preprocessor_encodes_and_decodes
      #     test_hybrid_scorer_weight_constraint
      #     test_artifact_directory_structure_ready
      #     test_database_table_creates_without_error
      #
      # Pipeline STOPS here if any of the 28 tests fail
      # train_pipeline.py NEVER runs if this step fails
      # ========================================================================
      - name: "Step 5 — CI: Smoke Tests (28 tests) Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 5 — CI: Smoke Tests Inside Container"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run python data/generate_dataset.py &&
            uv run pytest \
              tests/test_smoke.py::TestEnvironmentSetup \
              tests/test_smoke.py::TestModuleImports \
              tests/test_smoke.py::TestModelReadiness \
              -v --tb=short
          "
          echo "✓ All 28 smoke tests passed — pipeline continues to training"

      # ========================================================================
      # STEP 6 — CD: RUN train_pipeline.py INSIDE CONTAINER
      # TFS equivalent → Step 6: CD Run train_pipeline.py Inside Container
      # Only reached if ALL 28 smoke tests passed
      #
      # Runs full 8-phase training pipeline inside recommendation-engine-idbi:
      #   Phase 1 — Load bank_voucher_interactions.csv
      #   Phase 2 — Preprocess → 2000×20 sparse matrix
      #   Phase 3 — Train ALS (64 factors, 20 iterations)
      #   Phase 4 — Build TF-IDF semantic embeddings (20×189)
      #   Phase 5 — Hybrid scoring (65% ALS + 35% Semantic)
      #   Phase 6 — Generate top-10 recommendations for all customers
      #   Phase 7 — Deliver ~15,798 rows to ab_idbi_recommendations_uat
      #   Phase 8 — Post-training artifact validation
      #
      # uv respects pyproject.toml — no reinstall needed inside container
      # All volume mounts already set in docker-compose.yml
      # ========================================================================
      - name: "Step 6 — CD: Run train_pipeline.py with uv Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 6 — CD: Run train_pipeline.py Inside Container"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run python train_pipeline.py
          "
          echo "✓ Training complete — .pkl artifacts written to model_artifacts/"

      # ========================================================================
      # STEP 7 — POST CD: MODEL ARTIFACT CHECKS INSIDE CONTAINER (22 TESTS)
      # TFS equivalent → Step 7: Post CD Category 6 Model Artifacts Check
      #
      # Runs INSIDE container AFTER train_pipeline.py completes
      # Uses tests/post_training/test_artifacts.py → class TestPklArtifacts
      # Validates all 6 .pkl files created by train_pipeline.py:
      #
      #   test_pkl_file_exists[als_model.pkl]
      #   test_pkl_file_exists[user_factors.pkl]
      #   test_pkl_file_exists[item_factors.pkl]
      #   test_pkl_file_exists[voucher_embeddings.pkl]
      #   test_pkl_file_exists[user_encoder.pkl]
      #   test_pkl_file_exists[item_encoder.pkl]
      #   test_pkl_file_is_not_empty[als_model.pkl]
      #   test_pkl_file_is_not_empty[user_factors.pkl]
      #   test_pkl_file_is_not_empty[item_factors.pkl]
      #   test_pkl_file_is_not_empty[voucher_embeddings.pkl]
      #   test_pkl_file_is_not_empty[user_encoder.pkl]
      #   test_pkl_file_is_not_empty[item_encoder.pkl]
      #   test_pkl_file_is_loadable[als_model.pkl]
      #   test_pkl_file_is_loadable[user_factors.pkl]
      #   test_pkl_file_is_loadable[item_factors.pkl]
      #   test_pkl_file_is_loadable[voucher_embeddings.pkl]
      #   test_pkl_file_is_loadable[user_encoder.pkl]
      #   test_pkl_file_is_loadable[item_encoder.pkl]
      #   test_user_factors_shape
      #   test_item_factors_shape
      #   test_embeddings_shape_and_normalized
      #   test_encoder_classes_non_empty
      #
      # Pipeline STOPS here if any artifact check fails
      # ========================================================================
      - name: "Step 7 — Post CD: Model Artifact Checks (22 tests) Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 7 — Post CD: Model Artifact Checks"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run pytest \
              tests/post_training/test_artifacts.py::TestPklArtifacts \
              tests/post_training/test_artifacts.py::TestPklArtifacts::test_user_factors_shape \
              tests/post_training/test_artifacts.py::TestPklArtifacts::test_item_factors_shape \
              tests/post_training/test_artifacts.py::TestPklArtifacts::test_embeddings_shape_and_normalized \
              tests/post_training/test_artifacts.py::TestPklArtifacts::test_encoder_classes_non_empty \
              -v --tb=short
          "
          echo "✓ All 22 artifact checks passed — pipeline complete"

      # ========================================================================
      # STEP 8 — DESTROY CONTAINER AFTER PIPELINE COMPLETES
      # TFS equivalent → Step 8: Destroy Container via Makefile (make destroy)
      # Stops and removes recommendation-engine-idbi container
      # Removes named volumes: recommendation-engine-venv, recommendation-engine-uv-cache
      # if: always() → runs even if any previous step failed (cleanup guaranteed)
      # Next pipeline run recreates fresh from docker-compose.yml
      # ========================================================================
      - name: "Step 8 — Destroy Container (make destroy equivalent)"
        if: always()
        run: |
          echo "========================================================"
          echo " STEP 8 — Destroy Container"
          echo "========================================================"
          docker compose down --volumes --remove-orphans
          docker system prune -f
          echo "✓ Container recommendation-engine-idbi destroyed"
          echo "✓ Named volumes removed"
          echo "✓ Zero memory footprint — runner environment clean"
          echo "✓ Next pipeline run will recreate fresh from docker-compose.yml"
