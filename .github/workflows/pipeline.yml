# ==============================================================================
# .github/workflows/pipeline.yml
# IDBI Gift Voucher Recommendation Engine — GitHub Actions CI/CD Pipeline
# ==============================================================================

name: "IDBI Recommendation Engine — CI/CD Pipeline"

on:
  push:
    branches:
      - ci-cd-final
  pull_request:
    branches:
      - ci-cd-final

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
  COMPOSE_PROJECT_NAME: recommendation-engine-idbi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pipeline:
    name: "IDBI CI/CD Pipeline — 8 Steps"
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: "Checkout ci-cd-final branch"
        uses: actions/checkout@v4.2.2

      # ── Install UV on runner (for Step 1 linting only) ───────────────────────
      - name: "Install UV on runner"
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python 3.9 and install dependencies for linting"
        run: |
          uv python install 3.9
          uv sync --no-install-project

      # ========================================================================
      # STEP 1 — CI: RUFF LINTING (on runner, no container)
      # ========================================================================
      - name: "Step 1 — CI: Ruff Linting with uv on Runner Machine"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 1 — CI: Ruff Linting"
          echo "========================================================"
          uv run ruff --version
          uv run ruff check . --select F --ignore E402 --output-format grouped
          echo "Zero lint errors — pipeline continues to Step 2"

      # ========================================================================
      # STEP 2 — COMPOSE CHECK
      # ========================================================================
      - name: "Step 2 — Compose Check"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 2 — Compose Check"
          echo "========================================================"
          docker compose ps
          echo "Compose check complete"

      # ========================================================================
      # STEP 3 — START CONTAINER VIA DOCKER COMPOSE
      # ========================================================================
      - name: "Step 3 — Start Container via Docker Compose"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 3 — Start Container via Docker Compose"
          echo "========================================================"
          docker compose build
          docker compose up -d
          echo "Container started in detached mode"

      # ========================================================================
      # STEP 4 — VERIFY CONTAINER IS RUNNING
      # ========================================================================
      - name: "Step 4 — Verify Container is Running"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 4 — Verify Container is Running"
          echo "========================================================"
          docker compose ps -a
          echo "Container status verified"

      # ========================================================================
      # STEP 5 — CI: SMOKE TESTS INSIDE CONTAINER (28 tests)
      # ========================================================================
      - name: "Step 5 — CI: Smoke Tests (28 tests) Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 5 — CI: Smoke Tests Inside Container"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run python data/generate_dataset.py &&
            uv run pytest \
              tests/test_smoke.py::TestEnvironmentSetup \
              tests/test_smoke.py::TestModuleImports \
              tests/test_smoke.py::TestModelReadiness \
              -v --tb=short
          "
          echo "All 28 smoke tests passed"

      # ========================================================================
      # STEP 6 — CD: RUN train_pipeline.py INSIDE CONTAINER
      # ========================================================================
      - name: "Step 6 — CD: Run train_pipeline.py with uv Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 6 — CD: Run train_pipeline.py Inside Container"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run python train_pipeline.py
          "
          echo "Training complete"

      # ========================================================================
      # STEP 7 — POST CD: MODEL ARTIFACT CHECKS INSIDE CONTAINER (22 tests)
      # ========================================================================
      - name: "Step 7 — Post CD: Model Artifact Checks (22 tests) Inside Container"
        if: success()
        run: |
          echo "========================================================"
          echo " STEP 7 — Post CD: Model Artifact Checks"
          echo "========================================================"
          docker compose run --rm app bash -c "
            uv run pytest \
              tests/post_training/test_artifacts.py::TestPklArtifacts \
              -v --tb=short
          "
          echo "All 22 artifact checks passed"

      # ========================================================================
      # STEP 8 — DESTROY CONTAINER
      # ========================================================================
      - name: "Step 8 — Destroy Container"
        if: always()
        run: |
          echo "========================================================"
          echo " STEP 8 — Destroy Container"
          echo "========================================================"
          docker compose down --volumes --remove-orphans
          docker system prune -f
          echo "Container destroyed — zero memory footprint"
